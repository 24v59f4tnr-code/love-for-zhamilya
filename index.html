<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше маленькое место о любви ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f0c1b, #241432, #1a0b2e);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0.3; animation: twinkle 3s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        .container {
            max-width: 400px;
            width: 100%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }
        .header-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ffb6c1; }
        p { font-size: 15px; line-height: 1.5; color: #e0d0e0; }

        .photo-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .photo-card:hover { transform: translateY(-3px); }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .photo-caption {
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #fce4ec;
        }

        #musicBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 79, 139, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(255,79,139,0.4);
            transition: transform 0.2s;
        }
        #musicBtn:active { transform: scale(0.9); }

        .hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart { position: absolute; bottom: -50px; font-size: 20px; animation: floatUp 6s infinite linear; opacity: 0.7; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="hearts" id="hearts"></div>

    <div class="container">
        <div class="header-card">
            <h1>Для Жамили ❤️</h1>
            <p>Самое уютное место, созданное только для нас двоих.</p>
        </div>

        <!-- Карточка с фото 1 -->
        <div class="photo-card">
            <img src="IMG_0240.jpeg" alt="Наше фото">
            <div class="photo-caption">Каждый момент рядом с тобой особенный ✨</div>
        </div>

        <!-- Карточка с фото 2 -->
        <div class="photo-card">
            <img src="IMG_2673.jpeg" alt="Наше фото">
            <div class="photo-caption">Моя самая любимая 💖</div>
        </div>
    </div>

    <!-- Трек "in the sea" (Reze Arc) -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/k30e6v.mp3" type="audio/mpeg">
    </audio>

    <div id="musicBtn">🎵</div>

    <script>
        const stars = document.getElementById('stars');
        for(let i=0; i<60; i++){
            let s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random()*100 + '%';
            s.style.left = Math.random()*100 + '%';
            s.style.animationDelay = Math.random()*3 + 's';
            stars.appendChild(s);
        }

        const hearts = document.getElementById('hearts');
        const symbols = ['❤️', '✨', '💖', '💫'];
        for(let i=0; i<15; i++){
            let h = document.createElement('div');
            h.className = 'heart';
            h.innerText = symbols[Math.floor(Math.random()*symbols.length)];
            h.style.left = Math.random()*100 + '%';
            h.style.animationDuration = (Math.random()*4 + 5) + 's';
            h.style.animationDelay = Math.random()*5 + 's';
            hearts.appendChild(h);
        }

        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.style.opacity = '0.6';
                musicBtn.innerText = '🎵';
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicBtn.style.opacity = '1';
                    musicBtn.innerText = '💖';
                    isPlaying = true;
                }).catch(e => console.log("Ожидание тапа"));
            }
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        document.body.addEventListener('click', function startAudioOnce() {
            if (!isPlaying) {
                toggleMusic();
            }
            document.body.removeEventListener('click', startAudioOnce);
        }, { once: true });
    </script>
</body>
</html>
